<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹性与非弹性碰撞实验</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-x: auto;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #00d2ff, #3a7bd5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 18px;
  }
  .main-container {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 2400px;
  }
  .canvas-wrapper {
    background: #16213e;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    flex: 1;
    min-width: 600px;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .canvas-wrapper::-webkit-scrollbar { height: 8px; }
  .canvas-wrapper::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 4px; }
  .canvas-wrapper::-webkit-scrollbar-track { background: #0f0f23; border-radius: 4px; }
  canvas {
    display: block;
    border-radius: 10px;
    background: #0f0f23;
    min-width: 600px;
  }
  .panel {
    background: #16213e;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-thumb { background: #3a3a5a; border-radius: 3px; }
  .panel-section {
    background: #0f0f23;
    border-radius: 12px;
    padding: 16px;
  }
  .panel-section h3 {
    font-size: 15px;
    margin-bottom: 12px;
    color: #00d2ff;
    border-bottom: 1px solid #2a2a4a;
    padding-bottom: 8px;
  }
  .block-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    font-size: 13px;
    font-weight: bold;
  }
  .block-label .dot {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    display: inline-block;
  }
  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 8px 0;
    font-size: 13px;
  }
  .control-row label {
    min-width: 60px;
    color: #aaa;
  }
  .control-row input[type="range"] {
    flex: 1;
    margin: 0 10px;
    accent-color: #3a7bd5;
    cursor: pointer;
  }
  .control-row .value {
    min-width: 50px;
    text-align: right;
    color: #00d2ff;
    font-weight: bold;
    font-size: 14px;
  }
  .collision-type {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .collision-type button {
    flex: 1;
    padding: 10px;
    border: 2px solid #2a2a4a;
    border-radius: 10px;
    background: transparent;
    color: #aaa;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
  }
  .collision-type button.active {
    border-color: #00d2ff;
    background: rgba(0,210,255,0.1);
    color: #00d2ff;
    font-weight: bold;
  }
  .collision-type button:hover:not(.active) {
    border-color: #3a7bd5;
    color: #e0e0e0;
  }
  .restitution-row {
    margin-top: 10px;
    display: none;
  }
  .restitution-row.show { display: flex; }
  .wall-toggle {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .wall-toggle button {
    flex: 1;
    padding: 10px;
    border: 2px solid #2a2a4a;
    border-radius: 10px;
    background: transparent;
    color: #aaa;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
  }
  .wall-toggle button.active {
    border-color: #ffd700;
    background: rgba(255,215,0,0.1);
    color: #ffd700;
    font-weight: bold;
  }
  .wall-toggle button:hover:not(.active) {
    border-color: #3a7bd5;
    color: #e0e0e0;
  }
  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }
  .btn-group button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
  }
  .btn-start {
    background: linear-gradient(135deg, #00d2ff, #3a7bd5);
    color: #fff;
  }
  .btn-start:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,210,255,0.4); }
  .btn-reset {
    background: #2a2a4a;
    color: #e0e0e0;
  }
  .btn-reset:hover { background: #3a3a5a; }
  .data-panel {
    background: #0f0f23;
    border-radius: 12px;
    padding: 16px;
  }
  .data-panel h3 {
    font-size: 15px;
    margin-bottom: 10px;
    color: #00d2ff;
    border-bottom: 1px solid #2a2a4a;
    padding-bottom: 8px;
  }
  .data-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin: 4px 0;
    padding: 4px 0;
  }
  .data-row .label { color: #888; }
  .data-row .val { color: #fff; font-weight: bold; font-family: 'Consolas', monospace; }
  .energy-bar {
    height: 8px;
    border-radius: 4px;
    background: #2a2a4a;
    margin-top: 4px;
    overflow: hidden;
  }
  .energy-bar .fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.3s;
  }
  .ke-fill { background: linear-gradient(90deg, #00d2ff, #3a7bd5); }
  .lost-fill { background: linear-gradient(90deg, #ff6b6b, #ee5a24); }
  .status-text {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-top: 4px;
    min-height: 20px;
  }
  .status-text.collided { color: #ffd700; }
  .collision-count {
    text-align: center;
    font-size: 12px;
    color: #666;
    margin-top: 2px;
  }
</style>
</head>
<body>

<h1>⚛ 弹性与非弹性碰撞实验</h1>
<p class="subtitle">控制物块质量、大小、初始位置与轨道长度，观察不同碰撞类型下的运动变化</p>

<div class="main-container">
  <div class="canvas-wrapper">
    <canvas id="simCanvas" width="1200" height="360"></canvas>
    <div class="status-text" id="statusText">调整参数后点击「开始实验」</div>
    <div class="collision-count" id="collisionCount"></div>
  </div>

  <div class="panel">
    <!-- 碰撞类型 -->
    <div class="panel-section">
      <h3>碰撞类型</h3>
      <div class="collision-type">
        <button class="active" id="btnElastic" onclick="setCollisionType('elastic')">完全弹性碰撞</button>
        <button id="btnInelastic" onclick="setCollisionType('inelastic')">非弹性碰撞</button>
      </div>
      <div class="control-row restitution-row" id="restitutionRow">
        <label>恢复系数</label>
        <input type="range" id="restitution" min="0" max="0.99" step="0.01" value="0.3">
        <span class="value" id="restitutionVal">0.30</span>
      </div>
    </div>

    <!-- 物块A -->
    <div class="panel-section">
      <h3>物块 A（蓝色）</h3>
      <div class="block-label"><span class="dot" style="background:#3a7bd5"></span>向右运动</div>
      <div class="control-row">
        <label>质量</label>
        <input type="range" id="massA" min="1" max="50" step="0.5" value="5">
        <span class="value" id="massAVal">5.0 kg</span>
      </div>
      <div class="control-row">
        <label>大小</label>
        <input type="range" id="sizeA" min="20" max="120" step="2" value="50">
        <span class="value" id="sizeAVal">50 px</span>
      </div>
      <div class="control-row">
        <label>初速度</label>
        <input type="range" id="velA" min="0.5" max="15" step="0.1" value="4">
        <span class="value" id="velAVal">4.0 m/s</span>
      </div>
      <div class="control-row">
        <label>初始位置</label>
        <input type="range" id="posA" min="0" max="100" step="1" value="10">
        <span class="value" id="posAVal">10%</span>
      </div>
    </div>

    <!-- 物块B -->
    <div class="panel-section">
      <h3>物块 B（红色）</h3>
      <div class="block-label"><span class="dot" style="background:#ee5a24"></span>初始静止</div>
      <div class="control-row">
        <label>质量</label>
        <input type="range" id="massB" min="1" max="50" step="0.5" value="3">
        <span class="value" id="massBVal">3.0 kg</span>
      </div>
      <div class="control-row">
        <label>大小</label>
        <input type="range" id="sizeB" min="20" max="120" step="2" value="40">
        <span class="value" id="sizeBVal">40 px</span>
      </div>
      <div class="control-row">
        <label>初始位置</label>
        <input type="range" id="posB" min="0" max="100" step="1" value="85">
        <span class="value" id="posBVal">85%</span>
      </div>
    </div>

    <!-- 轨道 -->
    <div class="panel-section">
      <h3>轨道设置</h3>
      <div class="control-row">
        <label>轨道长度</label>
        <input type="range" id="trackLen" min="600" max="3000" step="50" value="1200">
        <span class="value" id="trackLenVal">1200 px</span>
      </div>
      <div style="margin-top:10px">
        <div style="font-size:13px;color:#aaa;margin-bottom:6px">墙壁设置</div>
        <div class="wall-toggle">
          <button class="active" id="btnWallOn" onclick="setWall(true)">🧱 有墙壁（反弹）</button>
          <button id="btnWallOff" onclick="setWall(false)">🚫 无墙壁（飞出）</button>
        </div>
      </div>
    </div>

    <!-- 按钮 -->
    <div class="btn-group">
      <button class="btn-start" id="btnStart" onclick="startSimulation()">▶ 开始实验</button>
      <button class="btn-reset" onclick="resetSimulation()">↺ 重置</button>
    </div>

    <!-- 数据面板 -->
    <div class="data-panel">
      <h3>📊 实时数据</h3>
      <div class="data-row"><span class="label">物块A 速度</span><span class="val" id="dataVelA">0.00 m/s</span></div>
      <div class="data-row"><span class="label">物块B 速度</span><span class="val" id="dataVelB">0.00 m/s</span></div>
      <div class="data-row"><span class="label">系统总动量</span><span class="val" id="dataMomentum">0.00</span></div>
      <div class="data-row"><span class="label">系统总动能</span><span class="val" id="dataKE">0.00 J</span></div>
      <div class="data-row"><span class="label">初始动能</span><span class="val" id="dataKE0">0.00 J</span></div>
      <div class="data-row"><span class="label">碰撞次数</span><span class="val" id="dataCollisions">0</span></div>
      <div style="margin-top:8px">
        <div style="font-size:12px;color:#888;margin-bottom:2px">动能保留比例</div>
        <div class="energy-bar"><div class="fill ke-fill" id="keBar" style="width:100%"></div></div>
      </div>
      <div>
        <div style="font-size:12px;color:#888;margin-bottom:2px">能量损失比例</div>
        <div class="energy-bar"><div class="fill lost-fill" id="lostBar" style="width:0%"></div></div>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== 全局状态 ====================
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

let collisionType = 'elastic';
let hasWall = true;
let running = false;
let animId = null;
let collisionCount = 0;

// 物块对象
let blockA = {}, blockB = {};
let trackLength = 1200;
const TRACK_PAD = 20;
let initialKE = 0;
let initialMomentum = 0;

// 碰撞冷却
let collisionCooldown = 0;

// 碰撞特效
let sparkles = [];
let shakeTime = 0;

// 物理子步进参数
const PHYSICS_SUBSTEPS = 8; // 每帧分成多个子步进，彻底防止穿模

// ==================== 控制面板绑定 ====================
const sliders = ['massA','sizeA','velA','posA','massB','sizeB','posB','trackLen','restitution'];
sliders.forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    updateSliderDisplay(id);
    if (id === 'posA' || id === 'posB') clampPositions();
    if (!running) { initBlocks(); drawScene(); }
  });
});

function updateSliderDisplay(id) {
  const el = document.getElementById(id);
  const v = parseFloat(el.value);
  switch(id) {
    case 'massA': document.getElementById('massAVal').textContent = v.toFixed(1)+' kg'; break;
    case 'sizeA': document.getElementById('sizeAVal').textContent = v+' px'; break;
    case 'velA': document.getElementById('velAVal').textContent = v.toFixed(1)+' m/s'; break;
    case 'posA': document.getElementById('posAVal').textContent = Math.round(v)+'%'; break;
    case 'massB': document.getElementById('massBVal').textContent = v.toFixed(1)+' kg'; break;
    case 'sizeB': document.getElementById('sizeBVal').textContent = v+' px'; break;
    case 'posB': document.getElementById('posBVal').textContent = Math.round(v)+'%'; break;
    case 'trackLen':
      document.getElementById('trackLenVal').textContent = v+' px';
      trackLength = v;
      canvas.width = v;
      clampPositions();
      if (!running) drawScene();
      break;
    case 'restitution': document.getElementById('restitutionVal').textContent = v.toFixed(2); break;
  }
}

// 确保两个物块初始位置不重叠
function clampPositions() {
  const sA = parseFloat(document.getElementById('sizeA').value);
  const sB = parseFloat(document.getElementById('sizeB').value);
  const tL = parseFloat(document.getElementById('trackLen').value);
  const usable = tL - 2 * TRACK_PAD;

  const posAEl = document.getElementById('posA');
  const posBEl = document.getElementById('posB');
  let pA = parseFloat(posAEl.value);
  let pB = parseFloat(posBEl.value);

  // 将百分比转为像素位置（左边缘）
  const xA = TRACK_PAD + (pA / 100) * usable;
  const xB = TRACK_PAD + (pB / 100) * usable;

  // A的右边缘不能超过B的左边缘（留至少2px间隙）
  const minGap = 2;
  if (xA + sA + minGap > xB) {
    // A太靠右了，把A往左推
    const maxPA = ((xB - sA - minGap - TRACK_PAD) / usable) * 100;
    if (maxPA >= 0) {
      posAEl.value = Math.max(0, maxPA);
      document.getElementById('posAVal').textContent = Math.round(posAEl.value) + '%';
    }
  }
  if (xB + sB + minGap > xA && xB < xA) {
    // B太靠右了（B在A左边的情况）
    const maxPB = ((xA - sB - minGap - TRACK_PAD) / usable) * 100;
    if (maxPB >= 0) {
      posBEl.value = Math.max(0, maxPB);
      document.getElementById('posBVal').textContent = Math.round(posBEl.value) + '%';
    }
  }
}

function setCollisionType(type) {
  collisionType = type;
  document.getElementById('btnElastic').classList.toggle('active', type === 'elastic');
  document.getElementById('btnInelastic').classList.toggle('active', type === 'inelastic');
  document.getElementById('restitutionRow').classList.toggle('show', type === 'inelastic');
  if (!running) drawScene();
}

function setWall(wall) {
  hasWall = wall;
  document.getElementById('btnWallOn').classList.toggle('active', wall);
  document.getElementById('btnWallOff').classList.toggle('active', !wall);
  if (!running) drawScene();
}

// ==================== 初始化物块 ====================
function initBlocks() {
  const mA = parseFloat(document.getElementById('massA').value);
  const sA = parseFloat(document.getElementById('sizeA').value);
  const vA = parseFloat(document.getElementById('velA').value);
  const pA = parseFloat(document.getElementById('posA').value);
  const mB = parseFloat(document.getElementById('massB').value);
  const sB = parseFloat(document.getElementById('sizeB').value);
  const pB = parseFloat(document.getElementById('posB').value);
  trackLength = parseFloat(document.getElementById('trackLen').value);
  canvas.width = trackLength;

  const usable = trackLength - 2 * TRACK_PAD;

  blockA = {
    x: TRACK_PAD + (pA / 100) * usable,
    w: sA,
    h: sA,
    mass: mA,
    vx: vA * 60,
    color: '#3a7bd5',
    gradient: ['#00d2ff','#3a7bd5'],
    label: 'A',
    active: true
  };
  blockB = {
    x: TRACK_PAD + (pB / 100) * usable,
    w: sB,
    h: sB,
    mass: mB,
    vx: 0,
    color: '#ee5a24',
    gradient: ['#ff6b6b','#ee5a24'],
    label: 'B',
    active: true
  };

  initialKE = 0.5 * mA * vA * vA;
  initialMomentum = mA * vA;
  collisionCount = 0;
  collisionCooldown = 0;
  sparkles = [];
  shakeTime = 0;
}

// ==================== 绘制 ====================
function drawScene() {
  const W = canvas.width;
  const H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const trackY = H * 0.55;
  const trackH = 4;
  const leftEdge = TRACK_PAD;
  const rightEdge = W - TRACK_PAD;

  // 轨道线
  ctx.fillStyle = '#2a2a4a';
  ctx.fillRect(leftEdge, trackY, rightEdge - leftEdge, trackH);

  // 轨道刻度
  ctx.fillStyle = '#444';
  ctx.font = '10px Consolas';
  const tickStep = 50;
  for (let x = leftEdge; x <= rightEdge; x += tickStep) {
    const isMajor = ((x - leftEdge) % 100 === 0);
    ctx.fillRect(x, trackY + trackH, 1, isMajor ? 10 : 6);
    if (isMajor) {
      ctx.fillText(Math.round(x - leftEdge), x - 8, trackY + trackH + 22);
    }
  }

  // 墙壁或开放端
  if (hasWall) {
    const wallGrad1 = ctx.createLinearGradient(leftEdge - 8, 0, leftEdge, 0);
    wallGrad1.addColorStop(0, '#555');
    wallGrad1.addColorStop(1, '#888');
    ctx.fillStyle = wallGrad1;
    ctx.fillRect(leftEdge - 8, trackY - 20, 8, trackH + 40);
    const wallGrad2 = ctx.createLinearGradient(rightEdge, 0, rightEdge + 8, 0);
    wallGrad2.addColorStop(0, '#888');
    wallGrad2.addColorStop(1, '#555');
    ctx.fillStyle = wallGrad2;
    ctx.fillRect(rightEdge, trackY - 20, 8, trackH + 40);
  } else {
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(leftEdge, trackY - 20);
    ctx.lineTo(leftEdge, trackY + trackH + 20);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(rightEdge, trackY - 20);
    ctx.lineTo(rightEdge, trackY + trackH + 20);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#444';
    ctx.font = '11px Microsoft YaHei';
    ctx.textAlign = 'center';
    ctx.fillText('← 开放', leftEdge - 20, trackY + 4);
    ctx.fillText('开放 →', rightEdge + 24, trackY + 4);
    ctx.textAlign = 'left';
  }

  // 物块
  if (blockA.active) drawBlock(blockA, trackY);
  if (blockB.active) drawBlock(blockB, trackY);

  // 速度箭头
  if (running) {
    if (blockA.active) drawVelocityArrow(blockA, trackY);
    if (blockB.active) drawVelocityArrow(blockB, trackY);
  }

  // 碰撞特效
  drawSparkles();

  // 标签
  ctx.fillStyle = '#555';
  ctx.font = '13px Microsoft YaHei';
  const typeText = collisionType === 'elastic' ? '完全弹性碰撞 (e=1)' : '非弹性碰撞 (e=' + parseFloat(document.getElementById('restitution').value).toFixed(2) + ')';
  const wallText = hasWall ? ' | 🧱 有墙壁' : ' | 🚫 无墙壁';
  ctx.fillText(typeText + wallText, 10, 24);

  updateDataPanel();
}

function drawBlock(block, trackY) {
  const bx = block.x;
  const by = trackY - block.h;
  const bw = block.w;
  const bh = block.h;

  ctx.shadowColor = block.color;
  ctx.shadowBlur = 15;
  ctx.shadowOffsetY = 4;

  const grad = ctx.createLinearGradient(bx, by, bx, by + bh);
  grad.addColorStop(0, block.gradient[0]);
  grad.addColorStop(1, block.gradient[1]);
  ctx.fillStyle = grad;

  const r = 6;
  ctx.beginPath();
  ctx.moveTo(bx + r, by);
  ctx.lineTo(bx + bw - r, by);
  ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + r);
  ctx.lineTo(bx + bw, by + bh - r);
  ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - r, by + bh);
  ctx.lineTo(bx + r, by + bh);
  ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - r);
  ctx.lineTo(bx, by + r);
  ctx.quadraticCurveTo(bx, by, bx + r, by);
  ctx.closePath();
  ctx.fill();

  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;

  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.max(14, bh * 0.35) + 'px Microsoft YaHei';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(block.label, bx + bw / 2, by + bh / 2 - 6);
  ctx.font = Math.max(10, bh * 0.22) + 'px Consolas';
  ctx.fillText(block.mass.toFixed(1) + 'kg', bx + bw / 2, by + bh / 2 + 10);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function drawVelocityArrow(block, trackY) {
  const speed = block.vx;
  if (Math.abs(speed) < 0.5) return;

  const cx = block.x + block.w / 2;
  const cy = trackY - block.h - 20;
  const arrowLen = Math.min(Math.abs(speed) * 0.5, 80);
  const dir = speed > 0 ? 1 : -1;

  ctx.strokeStyle = block.color;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + arrowLen * dir, cy);
  ctx.stroke();

  ctx.fillStyle = block.color;
  ctx.beginPath();
  ctx.moveTo(cx + arrowLen * dir, cy);
  ctx.lineTo(cx + (arrowLen - 8) * dir, cy - 5);
  ctx.lineTo(cx + (arrowLen - 8) * dir, cy + 5);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#ccc';
  ctx.font = '11px Consolas';
  ctx.textAlign = 'center';
  ctx.fillText((speed / 60).toFixed(2) + ' m/s', cx + arrowLen * dir * 0.5, cy - 10);
  ctx.textAlign = 'left';
}

function drawSparkles() {
  sparkles.forEach(s => {
    ctx.globalAlpha = s.life;
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * s.life, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ==================== 物理引擎（子步进 + 连续碰撞检测）====================
function updatePhysics(dt) {
  if (!running) return;

  const subDt = dt / PHYSICS_SUBSTEPS;

  for (let step = 0; step < PHYSICS_SUBSTEPS; step++) {
    physicsStep(subDt);
  }

  // 更新特效
  sparkles.forEach(s => {
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.life -= dt * 2;
  });
  sparkles = sparkles.filter(s => s.life > 0);

  if (shakeTime > 0) shakeTime -= dt;
}

function physicsStep(dt) {
  const leftEdge = TRACK_PAD;
  const rightEdge = trackLength - TRACK_PAD;

  // 保存旧位置
  const oldAx = blockA.x;
  const oldBx = blockB.x;

  // 移动
  if (blockA.active) blockA.x += blockA.vx * dt;
  if (blockB.active) blockB.x += blockB.vx * dt;

  // 碰撞冷却递减
  if (collisionCooldown > 0) collisionCooldown -= dt;

  // ---- 墙壁碰撞 ----
  if (hasWall) {
    if (blockA.active && blockA.x < leftEdge) {
      blockA.x = leftEdge;
      blockA.vx = Math.abs(blockA.vx);
      spawnWallSparkles(leftEdge, canvas.height * 0.55);
    }
    if (blockA.active && blockA.x + blockA.w > rightEdge) {
      blockA.x = rightEdge - blockA.w;
      blockA.vx = -Math.abs(blockA.vx);
      spawnWallSparkles(rightEdge, canvas.height * 0.55);
    }
    if (blockB.active && blockB.x < leftEdge) {
      blockB.x = leftEdge;
      blockB.vx = Math.abs(blockB.vx);
      spawnWallSparkles(leftEdge, canvas.height * 0.55);
    }
    if (blockB.active && blockB.x + blockB.w > rightEdge) {
      blockB.x = rightEdge - blockB.w;
      blockB.vx = -Math.abs(blockB.vx);
      spawnWallSparkles(rightEdge, canvas.height * 0.55);
    }
  } else {
    if (blockA.active && (blockA.x + blockA.w < leftEdge - 100 || blockA.x > rightEdge + 100)) {
      blockA.active = false;
    }
    if (blockB.active && (blockB.x + blockB.w < leftEdge - 100 || blockB.x > rightEdge + 100)) {
      blockB.active = false;
    }
  }

  // ---- 物块间碰撞检测（连续检测，防止穿模）----
  if (blockA.active && blockB.active && collisionCooldown <= 0) {
    // 检测AABB重叠
    const aRight = blockA.x + blockA.w;
    const bRight = blockB.x + blockB.w;

    if (aRight > blockB.x && blockA.x < bRight) {
      // 有重叠，判断谁在左边以及接近方向
      if (blockA.x <= blockB.x) {
        // A在左，B在右
        const relVel = blockA.vx - blockB.vx;
        if (relVel > 0) { // 正在接近
          performCollision();
          // 强制分离：确保不重叠
          const gap = aRight - blockB.x;
          if (gap > 0) {
            const totalMass = blockA.mass + blockB.mass;
            blockA.x -= gap * (blockB.mass / totalMass);
            blockB.x += gap * (blockA.mass / totalMass);
          }
        }
      } else {
        // B在左，A在右
        const relVel = blockB.vx - blockA.vx;
        if (relVel > 0) { // 正在接近
          performCollision();
          const gap = bRight - blockA.x;
          if (gap > 0) {
            const totalMass = blockA.mass + blockB.mass;
            blockB.x -= gap * (blockA.mass / totalMass);
            blockA.x += gap * (blockB.mass / totalMass);
          }
        }
      }
    }
  }
}

function performCollision() {
  collisionCount++;
  collisionCooldown = 0.02; // 20ms 冷却（子步进下足够）
  shakeTime = 0.15;

  const mA = blockA.mass;
  const mB = blockB.mass;
  const vA = blockA.vx;
  const vB = blockB.vx;

  let e;
  if (collisionType === 'elastic') {
    e = 1.0;
  } else {
    e = parseFloat(document.getElementById('restitution').value);
  }

  // 一维碰撞公式
  blockA.vx = (mA * vA + mB * vB + mB * e * (vB - vA)) / (mA + mB);
  blockB.vx = (mA * vA + mB * vB + mA * e * (vA - vB)) / (mA + mB);

  // 碰撞火花
  const cx = (blockA.x + blockA.w / 2 + blockB.x + blockB.w / 2) / 2;
  const cy = canvas.height * 0.55 - Math.max(blockA.h, blockB.h) / 2;
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 60 + Math.random() * 200;
    sparkles.push({
      x: cx + (Math.random() - 0.5) * 10,
      y: cy + (Math.random() - 0.5) * 10,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 2 + Math.random() * 3,
      life: 1,
      color: ['#ffd700', '#ff6b6b', '#00d2ff', '#fff'][Math.floor(Math.random() * 4)]
    });
  }

  // 更新状态文字
  const statusEl = document.getElementById('statusText');
  statusEl.textContent = '💥 第 ' + collisionCount + ' 次碰撞！';
  statusEl.classList.add('collided');
  setTimeout(() => {
    if (running) {
      statusEl.textContent = collisionType === 'elastic'
        ? '弹性碰撞 — 动能守恒，物块将持续反弹'
        : '非弹性碰撞 — 每次碰撞损失部分动能';
    }
  }, 1500);
}

function spawnWallSparkles(wx, wy) {
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 30 + Math.random() * 100;
    sparkles.push({
      x: wx + (Math.random() - 0.5) * 6,
      y: wy + (Math.random() - 0.5) * 20,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 1.5 + Math.random() * 2,
      life: 0.8,
      color: ['#ffd700', '#aaa', '#fff'][Math.floor(Math.random() * 3)]
    });
  }
}

// ==================== 数据面板 ====================
function updateDataPanel() {
  const vA = blockA.active ? blockA.vx / 60 : 0;
  const vB = blockB.active ? blockB.vx / 60 : 0;
  const mA = blockA.mass;
  const mB = blockB.mass;

  const momentum = mA * vA + mB * vB;
  const ke = 0.5 * mA * vA * vA + 0.5 * mB * vB * vB;

  document.getElementById('dataVelA').textContent = (blockA.active ? vA.toFixed(2) : '—') + ' m/s';
  document.getElementById('dataVelB').textContent = (blockB.active ? vB.toFixed(2) : '—') + ' m/s';
  document.getElementById('dataMomentum').textContent = momentum.toFixed(2) + ' kg·m/s';
  document.getElementById('dataKE').textContent = ke.toFixed(2) + ' J';
  document.getElementById('dataKE0').textContent = initialKE.toFixed(2) + ' J';
  document.getElementById('dataCollisions').textContent = collisionCount;

  const kePercent = initialKE > 0 ? Math.min(100, (ke / initialKE) * 100) : 100;
  const lostPercent = 100 - kePercent;
  document.getElementById('keBar').style.width = kePercent + '%';
  document.getElementById('lostBar').style.width = Math.max(0, lostPercent) + '%';
}

// ==================== 动画循环 ====================
let lastTime = 0;
function animate(timestamp) {
  if (!running) return;

  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  updatePhysics(dt);

  if (shakeTime > 0) {
    const shake = shakeTime * 20;
    canvas.style.transform = `translate(${(Math.random()-0.5)*shake}px, ${(Math.random()-0.5)*shake}px)`;
  } else {
    canvas.style.transform = '';
  }

  drawScene();
  animId = requestAnimationFrame(animate);
}

// ==================== 控制函数 ====================
function startSimulation() {
  if (running) return;
  clampPositions();
  initBlocks();
  running = true;
  lastTime = performance.now();

  document.getElementById('btnStart').textContent = '⏸ 运行中...';
  document.getElementById('btnStart').style.opacity = '0.6';
  document.getElementById('statusText').textContent = '🚀 实验进行中...';
  document.getElementById('statusText').classList.remove('collided');
  document.getElementById('collisionCount').textContent = '';

  sliders.forEach(id => { document.getElementById(id).disabled = true; });

  animId = requestAnimationFrame(animate);
}

function resetSimulation() {
  running = false;
  if (animId) cancelAnimationFrame(animId);
  sparkles = [];
  shakeTime = 0;
  canvas.style.transform = '';

  document.getElementById('btnStart').textContent = '▶ 开始实验';
  document.getElementById('btnStart').style.opacity = '1';
  document.getElementById('statusText').textContent = '调整参数后点击「开始实验」';
  document.getElementById('statusText').classList.remove('collided');
  document.getElementById('collisionCount').textContent = '';

  sliders.forEach(id => { document.getElementById(id).disabled = false; });

  clampPositions();
  initBlocks();
  drawScene();
}

// ==================== 初始化 ====================
clampPositions();
initBlocks();
drawScene();
</script>
