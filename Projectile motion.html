<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抛体运动 - 物理模拟动画</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-secondary: #5a6c7d;
            --accent: #e5553d;
            --accent-hover: #c9402b;
            --accent2: #3182ce;
            --accent2-hover: #2b6cb0;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.10);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Menlo', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #e8eef5 0%, #f0f4f8 30%, #eaf0f6 60%, #f5f7fa 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .main-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* 大标题 */
        .main-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            color: #1a202c;
            letter-spacing: 0.03em;
            padding: 6px 0 2px;
            position: relative;
        }
        .main-title::after {
            content: '';
            display: block;
            width: 70px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
            margin: 8px auto 0;
            opacity: 0.7;
        }
        .main-title .icon {
            display: inline-block;
            margin-right: 6px;
            font-size: 1.7rem;
            vertical-align: -2px;
        }

        /* 内容区域 */
        .content-row {
            display: flex;
            gap: 20px;
            align-items: stretch;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Canvas卡片 */
        .canvas-card {
            flex: 0 0 auto;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 16px 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .canvas-card:hover {
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
        }
        .module-subtitle {
            font-size: 0.95rem;
            font-weight: 600;
            color: #4a5568;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 10px;
            align-self: flex-start;
            padding-left: 4px;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .module-subtitle .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent2);
            display: inline-block;
        }
        canvas {
            display: block;
            border-radius: var(--radius-sm);
            background: #fdfdfe;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.04);
            cursor: default;
        }

        /* 控制面板卡片 */
        .control-card {
            flex: 0 0 300px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 18px 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid var(--border);
            min-width: 280px;
            transition: var(--transition);
        }
        .control-card:hover {
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
        }

        /* 参数组 */
        .param-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .param-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            letter-spacing: 0.02em;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .param-group label .param-value {
            font-weight: 700;
            color: #1a202c;
            font-size: 0.9rem;
            background: #f7fafc;
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            min-width: 52px;
            text-align: center;
            font-family: var(--font-mono);
        }
        .param-group input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, #e2e8f0 0%, #cbd5e0 100%);
            outline: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .param-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #fff;
            border: 2.5px solid var(--accent2);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            transition: var(--transition);
        }
        .param-group input[type="range"]::-webkit-slider-thumb:hover {
            border-color: #1a5d9e;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.18);
            transform: scale(1.05);
        }
        .param-group input[type="range"]:active::-webkit-slider-thumb {
            transform: scale(1.08);
            border-color: #1a5d9e;
        }

        /* 按钮 */
        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            min-width: 80px;
            padding: 11px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }
        .btn-launch {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(229, 85, 61, 0.35);
        }
        .btn-launch:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 20px rgba(229, 85, 61, 0.45);
            transform: translateY(-2px);
        }
        .btn-launch:active {
            transform: translateY(0);
            box-shadow: 0 3px 10px rgba(229, 85, 61, 0.3);
        }
        .btn-launch:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .btn-reset {
            background: #fff;
            color: #4a5568;
            border: 2px solid #cbd5e0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .btn-reset:hover {
            background: #f7fafc;
            border-color: #a0aec0;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
            transform: translateY(-2px);
        }
        .btn-reset:active {
            transform: translateY(0);
        }

        /* 数据展示 */
        .data-display {
            background: #f9fafb;
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            color: #5a6c7d;
            padding: 3px 0;
            border-bottom: 1px dotted #e8ecf1;
        }
        .data-row:last-child {
            border-bottom: none;
        }
        .data-row .data-label {
            font-weight: 500;
        }
        .data-row .data-val {
            font-weight: 700;
            color: #1a202c;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            background: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #e8ecf1;
        }

        /* 预测数据 */
        .predict-display {
            background: #fefcf5;
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            border: 1px solid #f0e6cc;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .predict-display .predict-title {
            font-size: 0.78rem;
            font-weight: 700;
            color: #8b6914;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .predict-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: #6b5a2e;
            padding: 2px 0;
        }
        .predict-row .predict-val {
            font-weight: 700;
            color: #3d2e0a;
            font-family: var(--font-mono);
            font-size: 0.78rem;
        }

        /* 响应式 */
        @media (max-width: 1100px) {
            .content-row {
                flex-direction: column;
                align-items: center;
            }
            .control-card {
                flex: 0 0 auto;
                width: 100%;
                max-width: 760px;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 12px;
                padding: 14px 16px;
            }
            .control-card>* {
                flex: 1 1 140px;
                min-width: 130px;
            }
            .btn-row {
                flex: 1 1 100%;
            }
            canvas {
                width: 100%;
                height: auto;
            }
        }
        @media (max-width: 600px) {
            .main-title {
                font-size: 1.4rem;
            }
            .control-card {
                padding: 10px 12px;
                gap: 8px;
            }
            .btn {
                padding: 9px 10px;
                font-size: 0.8rem;
            }
            .param-group input[type="range"]::-webkit-slider-thumb {
                width: 22px;
                height: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 大标题 -->
        <h1 class="main-title">
            <span class="icon">🚀</span>抛体运动模拟
        </h1>

        <!-- 内容行 -->
        <div class="content-row">
            <!-- Canvas动画区域 -->
            <div class="canvas-card">
                <div class="module-subtitle">
                    <span class="dot"></span>运动轨迹
                </div>
                <canvas id="mainCanvas" width="750" height="500" aria-label="抛体运动轨迹动画"></canvas>
            </div>

            <!-- 控制面板 -->
            <div class="control-card">
                <div class="module-subtitle">
                    <span class="dot" style="background:#e5553d;"></span>参数设置
                </div>

                <!-- 初速度大小 -->
                <div class="param-group">
                    <label>
                        初速度大小
                        <span class="param-value" id="speedVal">15.0 m/s</span>
                    </label>
                    <input type="range" id="speedSlider" min="3" max="28" value="15" step="0.5" aria-label="初速度大小">
                </div>

                <!-- 发射角度 -->
                <div class="param-group">
                    <label>
                        发射角度
                        <span class="param-value" id="angleVal">45°</span>
                    </label>
                    <input type="range" id="angleSlider" min="1" max="89" value="45" step="1" aria-label="发射角度">
                </div>

                <!-- 重力加速度 -->
                <div class="param-group">
                    <label>
                        重力加速度
                        <span class="param-value" id="gravityVal">9.80 m/s²</span>
                    </label>
                    <input type="range" id="gravitySlider" min="1" max="25" value="9.8" step="0.1" aria-label="重力加速度">
                </div>

                <!-- 按钮 -->
                <div class="btn-row">
                    <button class="btn btn-launch" id="btnLaunch" title="发射质点">🎯 发射</button>
                    <button class="btn btn-reset" id="btnReset" title="清除轨迹并重置">↺ 重置</button>
                </div>

                <!-- 实时数据 -->
                <div class="data-display" id="dataDisplay">
                    <div class="data-row">
                        <span class="data-label">⏱ 时间 t</span>
                        <span class="data-val" id="dataTime">0.000 s</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">📐 水平位移 x</span>
                        <span class="data-val" id="dataX">0.000 m</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">📏 竖直高度 y</span>
                        <span class="data-val" id="dataY">0.000 m</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">➡ 水平速度 vₓ</span>
                        <span class="data-val" id="dataVx">0.00 m/s</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">⬆ 竖直速度 vᵧ</span>
                        <span class="data-val" id="dataVy">0.00 m/s</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">💨 合速度 |v|</span>
                        <span class="data-val" id="dataV">0.00 m/s</span>
                    </div>
                </div>

                <!-- 理论预测 -->
                <div class="predict-display" id="predictDisplay">
                    <div class="predict-title">📋 理论预测</div>
                    <div class="predict-row">
                        <span>射程 R</span>
                        <span class="predict-val" id="predictRange">— m</span>
                    </div>
                    <div class="predict-row">
                        <span>最大高度 H</span>
                        <span class="predict-val" id="predictHeight">— m</span>
                    </div>
                    <div class="predict-row">
                        <span>飞行时间 T</span>
                        <span class="predict-val" id="predictTime">— s</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ============ DOM 元素 ============
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');

            const speedSlider = document.getElementById('speedSlider');
            const angleSlider = document.getElementById('angleSlider');
            const gravitySlider = document.getElementById('gravitySlider');
            const speedValEl = document.getElementById('speedVal');
            const angleValEl = document.getElementById('angleVal');
            const gravityValEl = document.getElementById('gravityVal');
            const btnLaunch = document.getElementById('btnLaunch');
            const btnReset = document.getElementById('btnReset');

            const dataTimeEl = document.getElementById('dataTime');
            const dataXEl = document.getElementById('dataX');
            const dataYEl = document.getElementById('dataY');
            const dataVxEl = document.getElementById('dataVx');
            const dataVyEl = document.getElementById('dataVy');
            const dataVEl = document.getElementById('dataV');
            const predictRangeEl = document.getElementById('predictRange');
            const predictHeightEl = document.getElementById('predictHeight');
            const predictTimeEl = document.getElementById('predictTime');

            // ============ Canvas 尺寸 ============
            const CANVAS_W = canvas.width;
            const CANVAS_H = canvas.height;

            // 原点在canvas中的位置（世界坐标(0,0)映射到此）
            const ORIGIN_CX = 95;
            const ORIGIN_CY = 420;

            // 可用空间
            const AVAIL_X = CANVAS_W - ORIGIN_CX - 35; // 右侧留白
            const AVAIL_Y = ORIGIN_CY - 40; // 上方留白

            // ============ 物理参数 ============
            let v0 = parseFloat(speedSlider.value); // 初速度大小 (m/s)
            let angleDeg = parseInt(angleSlider.value); // 发射角度 (度)
            let g = parseFloat(gravitySlider.value); // 重力加速度 (m/s²)

            // 比例尺（像素/米），在发射时动态计算
            let scale = 22; // 默认比例尺
            const DEFAULT_SCALE = 22;

            // ============ 模拟状态 ============
            const STATE = { IDLE: 'idle', RUNNING: 'running', COMPLETED: 'completed' };
            let simState = STATE.IDLE;
            let simTime = 0; // 模拟时间 (秒)
            let posX = 0; // 世界坐标 x (m)
            let posY = 0; // 世界坐标 y (m)
            let velX = 0; // 世界速度 vx (m/s)
            let velY = 0; // 世界速度 vy (m/s)
            let trajectoryPoints = []; // 轨迹点数组 [{x_world, y_world, time}]
            let lastFrameTime = null; // 上一帧的时间戳
            let animFrameId = null;

            // ============ 辅助函数：坐标转换 ============
            function worldToCanvas(wx, wy) {
                return {
                    cx: ORIGIN_CX + wx * scale,
                    cy: ORIGIN_CY - wy * scale
                };
            }

            function canvasToWorld(cx, cy) {
                return {
                    wx: (cx - ORIGIN_CX) / scale,
                    wy: (ORIGIN_CY - cy) / scale
                };
            }

            // ============ 计算理论值 ============
            function computePredictions() {
                const angleRad = angleDeg * Math.PI / 180;
                const sinA = Math.sin(angleRad);
                const cosA = Math.cos(angleRad);
                const sin2A = Math.sin(2 * angleRad);

                const range = (v0 * v0 * sin2A) / g;
                const maxHeight = (v0 * v0 * sinA * sinA) / (2 * g);
                const flightTime = (2 * v0 * sinA) / g;

                return {
                    range,
                    maxHeight,
                    flightTime,
                    sinA,
                    cosA
                };
            }

            // ============ 动态计算比例尺 ============
            function computeScale() {
                const pred = computePredictions();
                const neededX = pred.range;
                const neededY = pred.maxHeight;

                // 为坐标轴标签留额外空间
                const scaleX = AVAIL_X / (neededX + 1.5);
                const scaleY = AVAIL_Y / (neededY + 1.5);

                let candidate = Math.min(scaleX, scaleY);

                // 限制比例尺范围
                candidate = Math.max(6, Math.min(80, candidate));

                // 对于接近90°的情况（射程很小），确保有合理的x轴显示
                if (neededX < 0.5 && neededY > 5) {
                    candidate = Math.min(candidate, AVAIL_Y / (neededY + 2));
                }
                // 对于接近0°的情况（高度很小），确保有合理的y轴显示
                if (neededY < 0.5 && neededX > 5) {
                    candidate = Math.min(candidate, AVAIL_X / (neededX + 3));
                }

                return Math.round(candidate * 100) / 100;
            }

            // ============ 选择合适的刻度间距 ============
            function chooseTickSpacing(worldRange, targetPixelSpacing = 60) {
                const approxSpacing = worldRange / (AVAIL_X / targetPixelSpacing);
                const magnitudes = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500];
                let best = magnitudes[0];
                let bestDiff = Math.abs(approxSpacing - best);
                for (const m of magnitudes) {
                    const diff = Math.abs(approxSpacing - m);
                    if (diff < bestDiff) {
                        bestDiff = diff;
                        best = m;
                    }
                }
                return best;
            }

            // ============ 绘制函数 ============
            function drawGrid(xMaxWorld, yMaxWorld) {
                const tickSpacingX = chooseTickSpacing(xMaxWorld, 55);
                const tickSpacingY = chooseTickSpacing(yMaxWorld, 50);

                ctx.save();
                ctx.strokeStyle = '#e8ecf1';
                ctx.lineWidth = 0.6;
                ctx.setLineDash([3, 5]);
                ctx.lineDashOffset = 0;

                // 垂直网格线 (沿x轴)
                for (let wx = tickSpacingX; wx <= xMaxWorld + tickSpacingX; wx += tickSpacingX) {
                    const { cx, cy } = worldToCanvas(wx, 0);
                    if (cx <= CANVAS_W - 10 && cx >= ORIGIN_CX + 2) {
                        ctx.beginPath();
                        ctx.moveTo(cx, ORIGIN_CY + 15);
                        ctx.lineTo(cx, 28);
                        ctx.stroke();
                    }
                }
                // 水平网格线 (沿y轴)
                for (let wy = tickSpacingY; wy <= yMaxWorld + tickSpacingY; wy += tickSpacingY) {
                    const { cx, cy } = worldToCanvas(0, wy);
                    if (cy >= 25 && cy <= ORIGIN_CY + 10) {
                        ctx.beginPath();
                        ctx.moveTo(ORIGIN_CX - 18, cy);
                        ctx.lineTo(CANVAS_W - 10, cy);
                        ctx.stroke();
                    }
                }
                ctx.setLineDash([]);
                ctx.restore();

                // 返回刻度信息用于后续绘制
                return { tickSpacingX, tickSpacingY, xMaxWorld, yMaxWorld };
            }

            function drawAxes(tickInfo) {
                const { tickSpacingX, tickSpacingY, xMaxWorld, yMaxWorld } = tickInfo;

                ctx.save();
                // x轴
                ctx.strokeStyle = '#3a4a5c';
                ctx.lineWidth = 2.2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(ORIGIN_CX - 15, ORIGIN_CY);
                ctx.lineTo(CANVAS_W - 12, ORIGIN_CY);
                ctx.stroke();

                // x轴箭头
                ctx.fillStyle = '#3a4a5c';
                ctx.beginPath();
                ctx.moveTo(CANVAS_W - 12, ORIGIN_CY);
                ctx.lineTo(CANVAS_W - 26, ORIGIN_CY - 8);
                ctx.lineTo(CANVAS_W - 26, ORIGIN_CY + 8);
                ctx.closePath();
                ctx.fill();

                // y轴
                ctx.beginPath();
                ctx.moveTo(ORIGIN_CX, ORIGIN_CY + 18);
                ctx.lineTo(ORIGIN_CX, 22);
                ctx.stroke();

                // y轴箭头
                ctx.beginPath();
                ctx.moveTo(ORIGIN_CX, 22);
                ctx.lineTo(ORIGIN_CX - 8, 36);
                ctx.lineTo(ORIGIN_CX + 8, 36);
                ctx.closePath();
                ctx.fill();

                // 原点标记
                ctx.fillStyle = '#1a202c';
                ctx.beginPath();
                ctx.arc(ORIGIN_CX, ORIGIN_CY, 5.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(ORIGIN_CX, ORIGIN_CY, 2.8, 0, Math.PI * 2);
                ctx.fill();

                // 轴标签
                ctx.fillStyle = '#2d3748';
                ctx.font = 'bold 14px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('x', CANVAS_W - 6, ORIGIN_CY + 20);
                ctx.fillText('y', ORIGIN_CX - 18, 16);

                // 原点O标签
                ctx.fillText('O', ORIGIN_CX - 16, ORIGIN_CY + 18);

                // x轴刻度
                ctx.fillStyle = '#4a5568';
                ctx.font = '11px "SF Mono","Cascadia Code","Consolas",monospace';
                ctx.textAlign = 'center';
                for (let wx = tickSpacingX; wx <= xMaxWorld + tickSpacingX * 0.5; wx += tickSpacingX) {
                    const { cx } = worldToCanvas(wx, 0);
                    if (cx <= CANVAS_W - 18 && cx >= ORIGIN_CX + 8) {
                        // 刻度线
                        ctx.strokeStyle = '#4a5568';
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.moveTo(cx, ORIGIN_CY - 6);
                        ctx.lineTo(cx, ORIGIN_CY + 6);
                        ctx.stroke();
                        // 标签
                        const label = Number.isInteger(wx) ? wx.toString() : wx.toFixed(1);
                        ctx.fillText(label, cx, ORIGIN_CY + 20);
                    }
                }

                // y轴刻度
                ctx.textAlign = 'right';
                for (let wy = tickSpacingY; wy <= yMaxWorld + tickSpacingY * 0.5; wy += tickSpacingY) {
                    const { cy } = worldToCanvas(0, wy);
                    if (cy >= 22 && cy <= ORIGIN_CY - 6) {
                        ctx.strokeStyle = '#4a5568';
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.moveTo(ORIGIN_CX - 6, cy);
                        ctx.lineTo(ORIGIN_CX + 6, cy);
                        ctx.stroke();
                        const label = Number.isInteger(wy) ? wy.toString() : wy.toFixed(1);
                        ctx.fillText(label, ORIGIN_CX - 12, cy + 4);
                    }
                }

                // 单位标注
                ctx.fillStyle = '#718096';
                ctx.font = 'italic 11px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText('(m)', CANVAS_W - 42, ORIGIN_CY + 20);
                ctx.fillText('(m)', ORIGIN_CX - 36, 28);

                ctx.restore();
            }

            function drawTrajectory() {
                if (trajectoryPoints.length < 2) return;
                ctx.save();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                const totalPts = trajectoryPoints.length;

                for (let i = 1; i < totalPts; i++) {
                    const p0 = trajectoryPoints[i - 1];
                    const p1 = trajectoryPoints[i];
                    const pt0 = worldToCanvas(p0.x_world, p0.y_world);
                    const pt1 = worldToCanvas(p1.x_world, p1.y_world);

                    // 颜色渐变：从亮橙到深红
                    const t = i / totalPts;
                    const r = Math.round(235 - t * 50);
                    const g = Math.round(100 - t * 55);
                    const b = Math.round(35 + t * 30);
                    const alpha = 0.55 + t * 0.4;

                    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
                    ctx.lineWidth = 2.4 - t * 0.8;
                    ctx.beginPath();
                    ctx.moveTo(pt0.cx, pt0.cy);
                    ctx.lineTo(pt1.cx, pt1.cy);
                    ctx.stroke();
                }

                // 轨迹末端亮点
                if (trajectoryPoints.length > 0) {
                    const last = trajectoryPoints[trajectoryPoints.length - 1];
                    const lp = worldToCanvas(last.x_world, last.y_world);
                    const grad = ctx.createRadialGradient(lp.cx, lp.cy, 1, lp.cx, lp.cy, 10);
                    grad.addColorStop(0, 'rgba(255,200,80,0.9)');
                    grad.addColorStop(0.5, 'rgba(255,140,50,0.4)');
                    grad.addColorStop(1, 'rgba(255,100,40,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(lp.cx, lp.cy, 10, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            function drawProjectile() {
                const pt = worldToCanvas(posX, posY);
                const cx = pt.cx;
                const cy = pt.cy;

                // 仅当质点在可见范围内时绘制
                if (cx < -30 || cx > CANVAS_W + 30 || cy < -30 || cy > CANVAS_H + 30) return;

                ctx.save();

                // 光晕
                const glowGrad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 18);
                glowGrad.addColorStop(0, 'rgba(255,220,120,0.95)');
                glowGrad.addColorStop(0.35, 'rgba(255,140,50,0.6)');
                glowGrad.addColorStop(0.7, 'rgba(255,80,30,0.15)');
                glowGrad.addColorStop(1, 'rgba(255,60,20,0)');
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, 18, 0, Math.PI * 2);
                ctx.fill();

                // 主体球
                const ballGrad = ctx.createRadialGradient(cx - 1.5, cy - 2, 1, cx, cy, 7);
                ballGrad.addColorStop(0, '#fff8e8');
                ballGrad.addColorStop(0.3, '#ffb347');
                ballGrad.addColorStop(0.7, '#e8552d');
                ballGrad.addColorStop(1, '#b8301a');
                ctx.fillStyle = ballGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, 6.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(180,40,20,0.7)';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                // 高光点
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.beginPath();
                ctx.arc(cx - 2, cy - 2.5, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            function drawVelocityArrow() {
                if (simState !== STATE.RUNNING && simState !== STATE.IDLE) return;
                const pt = worldToCanvas(posX, posY);
                const cx = pt.cx;
                const cy = pt.cy;

                const vMag = Math.sqrt(velX * velX + velY * velY);
                if (vMag < 0.01) return;

                // 速度比例尺：1 m/s = 6 像素
                const velScale = 6;
                const arrowLen = vMag * velScale;
                const arrowLenClamped = Math.min(arrowLen, 140);

                const angle = Math.atan2(velY, velX);
                const endCX = cx + arrowLenClamped * Math.cos(angle);
                const endCY = cy - arrowLenClamped * Math.sin(angle);

                if (arrowLenClamped < 4) return;

                ctx.save();
                ctx.strokeStyle = 'rgba(49,130,206,0.85)';
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(endCX, endCY);
                ctx.stroke();

                // 箭头头部
                const headLen = Math.min(14, arrowLenClamped * 0.35);
                const headAngle = angle;
                const arrowBaseX = endCX - headLen * Math.cos(headAngle);
                const arrowBaseY = endCY + headLen * Math.sin(headAngle);

                ctx.fillStyle = 'rgba(49,130,206,0.9)';
                ctx.beginPath();
                ctx.moveTo(endCX, endCY);
                ctx.lineTo(
                    arrowBaseX - headLen * 0.55 * Math.cos(headAngle - Math.PI / 2),
                    arrowBaseY + headLen * 0.55 * Math.sin(headAngle - Math.PI / 2)
                );
                ctx.lineTo(
                    arrowBaseX - headLen * 0.55 * Math.cos(headAngle + Math.PI / 2),
                    arrowBaseY + headLen * 0.55 * Math.sin(headAngle + Math.PI / 2)
                );
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            function drawPreviewArrow() {
                // 在IDLE状态下绘制初速度预览箭头
                if (simState !== STATE.IDLE) return;
                const angleRad = angleDeg * Math.PI / 180;
                const previewVx = v0 * Math.cos(angleRad);
                const previewVy = v0 * Math.sin(angleRad);
                const vMag = v0;
                const velScale = 6;
                const arrowLen = Math.min(vMag * velScale, 130);

                const cx = ORIGIN_CX;
                const cy = ORIGIN_CY;
                const endCX = cx + arrowLen * Math.cos(angleRad);
                const endCY = cy - arrowLen * Math.sin(angleRad);

                if (arrowLen < 3) return;

                ctx.save();
                ctx.setLineDash([5, 4]);
                ctx.lineDashOffset = 0;
                ctx.strokeStyle = 'rgba(160,180,200,0.7)';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(endCX, endCY);
                ctx.stroke();
                ctx.setLineDash([]);

                // 预览箭头头部
                const headLen = Math.min(12, arrowLen * 0.3);
                const arrowBaseX = endCX - headLen * Math.cos(angleRad);
                const arrowBaseY = endCY + headLen * Math.sin(angleRad);
                ctx.fillStyle = 'rgba(140,165,190,0.75)';
                ctx.beginPath();
                ctx.moveTo(endCX, endCY);
                ctx.lineTo(
                    arrowBaseX - headLen * 0.5 * Math.cos(angleRad - Math.PI / 2),
                    arrowBaseY + headLen * 0.5 * Math.sin(angleRad - Math.PI / 2)
                );
                ctx.lineTo(
                    arrowBaseX - headLen * 0.5 * Math.cos(angleRad + Math.PI / 2),
                    arrowBaseY + headLen * 0.5 * Math.sin(angleRad + Math.PI / 2)
                );
                ctx.closePath();
                ctx.fill();

                // 预览标签
                ctx.fillStyle = '#718096';
                ctx.font = 'italic 12px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'left';
                const labelX = endCX + 10;
                const labelY = endCY - 4;
                ctx.fillText(`v₀ = ${v0.toFixed(1)} m/s`, Math.min(labelX, CANVAS_W - 120), Math.max(labelY, 20));
                ctx.fillText(`θ = ${angleDeg}°`, Math.min(labelX, CANVAS_W - 100), Math.max(labelY, 20) + 16);

                ctx.restore();
            }

            function drawAuxiliaryLines() {
                // 绘制从质点到坐标轴的辅助虚线
                if (simState !== STATE.RUNNING) return;
                if (posY < -0.05) return;
                const pt = worldToCanvas(posX, posY);
                if (pt.cx < ORIGIN_CX - 5 || pt.cx > CANVAS_W - 5) return;
                if (pt.cy < 10 || pt.cy > ORIGIN_CY + 5) return;

                ctx.save();
                ctx.setLineDash([2, 6]);
                ctx.lineDashOffset = 0;
                ctx.strokeStyle = 'rgba(160,175,195,0.5)';
                ctx.lineWidth = 1;

                // 到x轴的虚线
                ctx.beginPath();
                ctx.moveTo(pt.cx, pt.cy);
                ctx.lineTo(pt.cx, ORIGIN_CY);
                ctx.stroke();

                // 到y轴的虚线
                ctx.beginPath();
                ctx.moveTo(pt.cx, pt.cy);
                ctx.lineTo(ORIGIN_CX, pt.cy);
                ctx.stroke();

                // 小圆点标记在轴上的投影
                ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(100,130,160,0.6)';
                ctx.beginPath();
                ctx.arc(pt.cx, ORIGIN_CY, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(ORIGIN_CX, pt.cy, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            function drawGroundLine() {
                // 在地面(y=0)处绘制一条虚线参考线
                const pt = worldToCanvas(0, 0);
                ctx.save();
                ctx.setLineDash([8, 6]);
                ctx.lineDashOffset = 0;
                ctx.strokeStyle = 'rgba(180,190,200,0.45)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(ORIGIN_CX - 10, ORIGIN_CY);
                ctx.lineTo(CANVAS_W - 12, ORIGIN_CY);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();
            }

            function render() {
                // 清除画布
                ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

                // 背景微妙的渐变
                const bgGrad = ctx.createLinearGradient(0, 0, CANVAS_W, CANVAS_H);
                bgGrad.addColorStop(0, '#fefefe');
                bgGrad.addColorStop(0.5, '#fcfdfe');
                bgGrad.addColorStop(1, '#f9fafb');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

                // 确定世界坐标范围
                const xMaxWorld = (CANVAS_W - ORIGIN_CX - 10) / scale;
                const yMaxWorld = (ORIGIN_CY - 25) / scale;
                const effectiveXMax = Math.max(xMaxWorld, 5);
                const effectiveYMax = Math.max(yMaxWorld, 3);

                // 绘制网格
                const tickInfo = drawGrid(effectiveXMax, effectiveYMax);

                // 绘制地面参考线
                drawGroundLine();

                // 绘制坐标轴
                drawAxes(tickInfo);

                // 绘制轨迹
                drawTrajectory();

                // 绘制辅助线
                drawAuxiliaryLines();

                // 绘制预览箭头(IDLE状态)
                drawPreviewArrow();

                // 绘制速度箭头(RUNNING状态)
                if (simState === STATE.RUNNING) {
                    drawVelocityArrow();
                }

                // 绘制质点
                if (simState === STATE.IDLE) {
                    // 在原点绘制静止质点
                    const tempPX = posX;
                    const tempPY = posY;
                    posX = 0;
                    posY = 0;
                    drawProjectile();
                    posX = tempPX;
                    posY = tempPY;
                } else {
                    drawProjectile();
                }

                // 如果模拟完成，绘制落点标记
                if (simState === STATE.COMPLETED && trajectoryPoints.length > 0) {
                    const lastPt = trajectoryPoints[trajectoryPoints.length - 1];
                    const lp = worldToCanvas(lastPt.x_world, lastPt.y_world);
                    if (lp.cx > ORIGIN_CX - 8 && lp.cx < CANVAS_W - 5 && lp.cy > 5 && lp.cy < CANVAS_H - 5) {
                        ctx.save();
                        ctx.strokeStyle = 'rgba(200,60,30,0.8)';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([]);
                        ctx.beginPath();
                        ctx.arc(lp.cx, lp.cy, 9, 0, Math.PI * 2);
                        ctx.stroke();
                        // 十字标记
                        const cs = 6;
                        ctx.beginPath();
                        ctx.moveTo(lp.cx - cs, lp.cy - cs);
                        ctx.lineTo(lp.cx + cs, lp.cy + cs);
                        ctx.moveTo(lp.cx + cs, lp.cy - cs);
                        ctx.lineTo(lp.cx - cs, lp.cy + cs);
                        ctx.stroke();
                        ctx.fillStyle = '#c83a1e';
                        ctx.font = 'bold 11px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                        ctx.textAlign = 'left';
                        ctx.fillText('落点', lp.cx + 13, lp.cy - 2);
                        ctx.restore();
                    }
                }
            }

            // ============ 更新实时数据面板 ============
            function updateDataPanel() {
                const vMag = Math.sqrt(velX * velX + velY * velY);
                dataTimeEl.textContent = simTime.toFixed(3) + ' s';
                dataXEl.textContent = posX.toFixed(3) + ' m';
                dataYEl.textContent = Math.max(0, posY).toFixed(3) + ' m';
                dataVxEl.textContent = velX.toFixed(2) + ' m/s';
                dataVyEl.textContent = velY.toFixed(2) + ' m/s';
                dataVEl.textContent = vMag.toFixed(2) + ' m/s';
            }

            function updatePredictPanel() {
                const pred = computePredictions();
                predictRangeEl.textContent = pred.range.toFixed(2) + ' m';
                predictHeightEl.textContent = pred.maxHeight.toFixed(2) + ' m';
                predictTimeEl.textContent = pred.flightTime.toFixed(3) + ' s';
            }

            function resetDataPanel() {
                dataTimeEl.textContent = '0.000 s';
                dataXEl.textContent = '0.000 m';
                dataYEl.textContent = '0.000 m';
                dataVxEl.textContent = '0.00 m/s';
                dataVyEl.textContent = '0.00 m/s';
                dataVEl.textContent = '0.00 m/s';
            }

            // ============ 物理更新 ============
            function updatePhysics(deltaTime) {
                // 限制最大步长防止数值不稳定
                const dt = Math.min(deltaTime, 0.05);

                simTime += dt;
                const angleRad = angleDeg * Math.PI / 180;
                velX = v0 * Math.cos(angleRad);
                velY = v0 * Math.sin(angleRad) - g * simTime;
                posX = v0 * Math.cos(angleRad) * simTime;
                posY = v0 * Math.sin(angleRad) * simTime - 0.5 * g * simTime * simTime;

                // 记录轨迹点
                if (posY >= -0.05) {
                    trajectoryPoints.push({
                        x_world: posX,
                        y_world: Math.max(0, posY),
                        time: simTime
                    });
                }

                // 检测落地
                if (posY < -0.01 && simTime > 0.05) {
                    // 回退到地面
                    const angleRad2 = angleDeg * Math.PI / 180;
                    const flightTime = (2 * v0 * Math.sin(angleRad2)) / g;
                    simTime = flightTime;
                    posX = v0 * Math.cos(angleRad2) * flightTime;
                    posY = 0;
                    velX = v0 * Math.cos(angleRad2);
                    velY = v0 * Math.sin(angleRad2) - g * flightTime;

                    // 添加最终落点
                    if (trajectoryPoints.length === 0 || trajectoryPoints[trajectoryPoints.length - 1].y_world > 0.001) {
                        trajectoryPoints.push({
                            x_world: posX,
                            y_world: 0,
                            time: flightTime
                        });
                    }

                    simState = STATE.COMPLETED;
                    btnLaunch.disabled = false;
                    btnLaunch.textContent = '🎯 发射';
                    updateDataPanel();
                    return;
                }

                updateDataPanel();
            }

            // ============ 动画循环 ============
            function animationLoop(timestamp) {
                if (lastFrameTime === null) {
                    lastFrameTime = timestamp;
                }

                let deltaTime = (timestamp - lastFrameTime) / 1000; // 转换为秒
                if (deltaTime <= 0) deltaTime = 0.016;
                if (deltaTime > 0.1) deltaTime = 0.1; // 防止大帧跳跃

                if (simState === STATE.RUNNING) {
                    updatePhysics(deltaTime);
                }

                lastFrameTime = timestamp;
                render();

                // 始终请求下一帧（保持渲染）
                animFrameId = requestAnimationFrame(animationLoop);
            }

            // ============ 发射 ============
            function launch() {
                // 读取当前参数
                v0 = parseFloat(speedSlider.value);
                angleDeg = parseInt(angleSlider.value);
                g = parseFloat(gravitySlider.value);

                // 计算动态比例尺
                scale = computeScale();

                // 重置状态
                simTime = 0;
                posX = 0;
                posY = 0;
                const angleRad = angleDeg * Math.PI / 180;
                velX = v0 * Math.cos(angleRad);
                velY = v0 * Math.sin(angleRad);
                trajectoryPoints = [{ x_world: 0, y_world: 0, time: 0 }];
                lastFrameTime = null;
                simState = STATE.RUNNING;

                btnLaunch.disabled = true;
                btnLaunch.textContent = '⏳ 飞行中...';

                updateDataPanel();
                updatePredictPanel();
            }

            function resetSimulation() {
                simState = STATE.IDLE;
                simTime = 0;
                posX = 0;
                posY = 0;
                velX = 0;
                velY = 0;
                trajectoryPoints = [];
                lastFrameTime = null;
                scale = DEFAULT_SCALE;
                btnLaunch.disabled = false;
                btnLaunch.textContent = '🎯 发射';
                resetDataPanel();
                updatePredictPanel();
                render();
            }

            // ============ 事件监听 ============
            speedSlider.addEventListener('input', () => {
                v0 = parseFloat(speedSlider.value);
                speedValEl.textContent = v0.toFixed(1) + ' m/s';
                updatePredictPanel();
                if (simState === STATE.IDLE) {
                    scale = DEFAULT_SCALE;
                    render();
                }
            });

            angleSlider.addEventListener('input', () => {
                angleDeg = parseInt(angleSlider.value);
                angleValEl.textContent = angleDeg + '°';
                updatePredictPanel();
                if (simState === STATE.IDLE) {
                    scale = DEFAULT_SCALE;
                    render();
                }
            });

            gravitySlider.addEventListener('input', () => {
                g = parseFloat(gravitySlider.value);
                gravityValEl.textContent = g.toFixed(2) + ' m/s²';
                updatePredictPanel();
                if (simState === STATE.IDLE) {
                    scale = DEFAULT_SCALE;
                    render();
                }
            });

            btnLaunch.addEventListener('click', () => {
                if (simState === STATE.RUNNING) return;
                launch();
            });

            btnReset.addEventListener('click', () => {
                resetSimulation();
            });

            // 键盘快捷键
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'KeyL') {
                    e.preventDefault();
                    if (simState !== STATE.RUNNING) {
                        launch();
                    }
                } else if (e.code === 'KeyR') {
                    e.preventDefault();
                    resetSimulation();
                }
            });

            // Canvas点击也可触发发射
            canvas.addEventListener('click', (e) => {
                if (simState === STATE.RUNNING) {
                    // 运行中点击：重置
                    resetSimulation();
                } else {
                    launch();
                }
            });
            canvas.style.cursor = 'pointer';

            // ============ 初始化 ============
            function init() {
                v0 = parseFloat(speedSlider.value);
                angleDeg = parseInt(angleSlider.value);
                g = parseFloat(gravitySlider.value);
                speedValEl.textContent = v0.toFixed(1) + ' m/s';
                angleValEl.textContent = angleDeg + '°';
                gravityValEl.textContent = g.toFixed(2) + ' m/s²';
                scale = DEFAULT_SCALE;
                simState = STATE.IDLE;
                simTime = 0;
                posX = 0;
                posY = 0;
                velX = 0;
                velY = 0;
                trajectoryPoints = [];
                lastFrameTime = null;
                btnLaunch.disabled = false;
                btnLaunch.textContent = '🎯 发射';
                resetDataPanel();
                updatePredictPanel();
                render();

                // 启动动画循环
                animFrameId = requestAnimationFrame(animationLoop);

                // 自动运行：短暂延迟后自动发射
                setTimeout(() => {
                    if (simState === STATE.IDLE) {
                        launch();
                    }
                }, 600);
            }

            init();

            // ============ 清理（页面卸载时） ============
            window.addEventListener('beforeunload', () => {
                if (animFrameId) {
                    cancelAnimationFrame(animFrameId);
                }
            });

            console.log('🚀 抛体运动模拟已就绪');
            console.log('   - 拖动滑块调整初速度大小(3-28 m/s)');
            console.log('   - 拖动滑块调整发射角度(1°-89°)');
            console.log('   - 可调整重力加速度(1-25 m/s²)');
            console.log('   - 点击Canvas或按空格键发射');
            console.log('   - 按R键重置');
            console.log('   - 默认自动发射，比例尺动态适配');
            console.log('   📐 坐标系：原点O在发射位置，x轴水平向右，y轴竖直向上');
        })();
    </script>
</body>
</html>
